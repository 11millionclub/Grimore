# Publishes an over-the-air update to phones (Expo Go / installed builds).
# Paused for now: it only runs when started by hand from expo.dev -> Workflows.
# To make it automatic again, replace `workflow_dispatch: {}` with
#   push:
#     branches: ['main']
# Needs: the GitHub repo linked to the Expo project (base directory: grimore)
# and EXPO_PUBLIC_SUPABASE_URL / EXPO_PUBLIC_SUPABASE_ANON_KEY set as
# EAS environment variables for "production".
name: Publish update

on:
  workflow_dispatch: {}

jobs:
  publish_update:
    name: Publish update to main
    type: update
    environment: production
    params:
      branch: main
